version: '3.8'

services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=password123  # Change this later!
      - DOCKER_INFLUXDB_INIT_ORG=PIoT-20
      - DOCKER_INFLUXDB_INIT_BUCKET=sensor-data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-token-123

  adaptor:
    image: python:3.9-slim
    container_name: history-tracking-adaptor
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "8080:8080"
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=my-super-secret-token-123
      - INFLUXDB_ORG=PIoT-20
      - INFLUXDB_BUCKET=sensor-data
    command: >
      bash -c "pip install --no-cache-dir -r requirements.txt && python src/__main__.py"
    depends_on:
      - influxdb

volumes:
  influxdb_data:
  influxdb_config: